<!doctype html>
<html lang="ha">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Bot - AI Assistant</title>
<style>
:root{--blue:#0b86f3;--bg:#f7f9fb;--danger:#d93025;--ink:#20252b;--muted:#69727c}
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}body{min-height:100vh}
.wrap{min-height:100vh;display:flex;justify-content:center}.card{width:100%;min-height:100vh;background:#fff;display:flex;flex-direction:column;overflow:hidden}
.brand{height:92px;flex:0 0 92px;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#0788f5,#0781ef);color:#fff;padding:12px 16px;box-shadow:0 3px 12px rgba(0,0,0,.08)}
.title{margin:0;font-size:25px;font-weight:800;line-height:1.1;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sub{margin-top:5px;font-size:10px;opacity:.86;text-align:center}
.secret-box{margin:24px auto;padding:24px;width:min(520px,calc(100% - 40px));border:1px solid #e3e8ee;border-radius:18px;background:#fff;box-shadow:0 10px 35px rgba(26,43,66,.08)}
.secret-title{font-size:20px;font-weight:800;margin:0 0 7px}.secret-help{font-size:12px;color:var(--muted);line-height:1.6;margin:0 0 18px}label{display:block;font-size:11px;font-weight:800;letter-spacing:.08em;color:#5c6670;margin-bottom:9px}
input{width:100%;padding:13px;border-radius:14px;border:1px solid #d8dee5;background:#fff;color:var(--ink);outline:0;font:inherit}button{margin-top:12px;width:100%;padding:13px;border:0;border-radius:14px;background:var(--blue);color:#fff;font-weight:800;cursor:pointer;box-shadow:0 8px 20px rgba(11,134,243,.18)}button:disabled{opacity:.6;cursor:not-allowed}
.error{margin-top:12px;color:var(--danger);font-size:12px;line-height:1.5}.chat{display:none;flex:1;min-height:0;flex-direction:column;background:#fff}.messages{flex:1;min-height:0;overflow:auto;padding:24px 24px 96px;scroll-behavior:smooth}
.msg{padding:10px 14px;border-radius:16px;margin:9px 0;max-width:82%;line-height:1.5;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:0 1px 2px rgba(0,0,0,.03)}.bot{background:#e9edf1;color:#30363d;border-top-left-radius:5px}.user{margin-left:auto;background:var(--blue);color:#fff;border-top-right-radius:5px}
.composer{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;gap:10px;padding:10px 16px 14px;background:rgba(255,255,255,.98);border-top:1px solid #e3e7eb;box-shadow:0 -5px 18px rgba(24,38,56,.06);z-index:5}.composer input{flex:1;height:54px;padding:0 18px;border-radius:28px;font-size:15px}.composer button{width:54px;height:54px;flex:0 0 54px;margin:0;padding:0;border-radius:50%;font-size:24px}
.limit{position:fixed;right:20px;bottom:78px;font-size:10px;color:#7c858e;z-index:6}.thinking{width:25px;height:25px;border-radius:50%;display:inline-grid;place-items:center;border:1px solid #9aa4ae;color:#65707a;font-weight:900;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
body.bg-light,.card.bg-light{background:#fff}body.bg-dark{background:#111827;color:#f3f4f6}body.bg-dark .card{background:#111827;color:#f3f4f6}body.bg-dark .chat,body.bg-dark .messages{background:#111827}body.bg-dark .composer{background:rgba(17,24,39,.97);border-color:#263244}body.bg-dark .composer input{background:#1f2937;color:#fff;border-color:#374151}body.bg-dark .bot{background:#273244;color:#f3f4f6}body.bg-dark .limit{color:#9ca3af}body.bg-gradient{background:linear-gradient(135deg,#eef2ff,#f0fdfa,#eff6ff)}body.bg-gradient .card{background:rgba(255,255,255,.92);backdrop-filter:blur(10px)}body.bg-gradient .chat,body.bg-gradient .messages{background:transparent}
.disabled-state{display:none;flex:1;min-height:0;align-items:center;justify-content:center;text-align:center;padding:30px}.disabled-state .danger{font-size:12px;font-weight:900;letter-spacing:.12em;color:#b42318;margin-bottom:8px}.disabled-state strong{display:block;font-size:24px}.disabled-state p{font-size:12px;color:var(--muted);margin:8px 0 0}
@media(min-width:760px){.card{width:min(760px,100%);box-shadow:0 0 0 1px #edf0f3}.composer{left:50%;transform:translateX(-50%);width:min(760px,100%)}}
@media(max-width:520px){.brand{height:82px;flex-basis:82px}.title{font-size:23px}.messages{padding:20px 18px 92px}.composer{padding:9px 14px 13px}.composer input{height:52px;font-size:15px}.composer button{width:52px;height:52px;flex-basis:52px}.limit{bottom:72px;right:16px}}
</style>
</head>
<body>
<main class="wrap"><section class="card">
<div class="brand"><div><div id="title" class="title">Loading…</div><div id="sub" class="sub">Online</div></div></div>
<div id="request" class="secret-box"><h1 class="secret-title">Connect this website</h1><p class="secret-help">Wannan bot ɗin yana buƙatar Secret ID sau ɗaya domin tabbatar da wannan website. Bayan an yi register cikin nasara, ba za a sake tambayar Secret ID a wannan website ba.</p><label for="secret">SECRET ID</label><input id="secret" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="SDQXXXXXXXX" maxlength="11"><button id="verify" type="button">Verify &amp; Connect</button><div id="error" class="error" aria-live="polite"></div></div>
<div id="disabled" class="disabled-state"><div><div id="disabledType" class="danger">DANGEROUS</div><strong id="disabledText">Bot Disabled</strong><p id="disabledHelp">This bot is currently unavailable.</p></div></div>
<div id="chat" class="chat" aria-live="polite"><div id="messages" class="messages"></div><div id="limit" class="limit"></div><div class="composer"><input id="prompt" placeholder="Rubuta tambayarka a nan..." autocomplete="off"><button id="send" type="button" aria-label="Send">➤</button></div></div>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const BASE='https://hipzrtvrgjdeldfyudbc.supabase.co',CONNECT_URL=BASE+'/functions/v1/public-bot-verify',RUNTIME_URL=BASE+'/functions/v1/bot-chat-runtime',OWNER_PLAYGROUND_URL=BASE+'/functions/v1/owner-playground',PUBLIC_KEY='sb_publishable_NKHdv4Mza99fjiMBPk8C9A_bxcYmsmD',qs=new URLSearchParams(location.search),botId=(qs.get('bot_id')||'').trim(),playground=qs.get('playground')==='1';let ticket='',registrationOrigin='',currentInfo=null;
const $=id=>document.getElementById(id);function origin(v){try{const u=new URL(String(v||'').trim());return /^https?:$/.test(u.protocol)?u.origin.toLowerCase():''}catch{return''}}function discoverOrigin(){const q=origin(qs.get('site_origin'));if(q)return q;try{const r=origin(document.referrer);if(r&&r!==location.origin)return r}catch{}try{const a=window.location.ancestorOrigins;if(a&&a.length&&a[0]!==location.origin){const r=origin(a[0]);if(r)return r}}catch{}return origin(location.href)}registrationOrigin=discoverOrigin();
const safeBot=botId.replace(/[^a-z0-9_-]/gi,'').slice(0,100),cookieKey='sdq_public_ticket_'+btoa(registrationOrigin||'unknown').replace(/[^a-z0-9]/gi,'').slice(0,40)+'_'+safeBot,visitorKeyName='sdq_visitor_'+safeBot;
function getCookie(n){return document.cookie.split('; ').find(x=>x.startsWith(n+'='))?.slice(n.length+1)||''}function setCookie(n,v){try{document.cookie=n+'='+encodeURIComponent(v)+'; Max-Age=31536000; Path=/; Secure; SameSite=None; Partitioned'}catch{}}function clearCookie(n){try{document.cookie=n+'=; Max-Age=0; Path=/; Secure; SameSite=None; Partitioned'}catch{}}
function getVisitorKey(){try{let v=localStorage.getItem(visitorKeyName);if(v)return v;v=crypto.randomUUID?crypto.randomUUID():String(Date.now())+'-'+Math.random().toString(36).slice(2)+'-'+Math.random().toString(36).slice(2);localStorage.setItem(visitorKeyName,v);return v}catch{return 'fallback-'+location.origin+'-'+navigator.userAgent}}
function text(c){return({INVALID_SECRET_ID:'Incorrect Secret ID.',WEBSITE_ORIGIN_REQUIRED:'Website origin could not be verified.',BOT_DISABLED:'Bot Disabled',BOT_SUSPENDED:'Bot Suspended',ALL_BOTS_DISABLED:'Bot Disabled',INVALID_TICKET:'Website connection is invalid.',CHAT_LIMIT_REACHED:'Chat limit reached.',RATE_LIMIT:'AI service is temporarily rate limited.',MODEL_NOT_FOUND:'Configured AI model is unavailable.',INVALID_API_KEY:'AI service is temporarily unavailable. Your website connection is still active.',PROVIDER_ERROR:'AI provider failed to complete the request.',NETWORK_ERROR:'AI service connection failed.'}[c]||'Unable to complete the request.')}
function applyBackground(v){const bg=['light','dark','gradient'].includes(v)?v:'default';document.body.classList.remove('bg-light','bg-dark','bg-gradient');document.querySelector('.card')?.classList.remove('bg-light','bg-dark','bg-gradient');if(bg!=='default'){document.body.classList.add('bg-'+bg);document.querySelector('.card')?.classList.add('bg-'+bg)}}
function setName(name){const n=String(name||'Bot').trim()||'Bot';$('title').textContent=n;document.title=n+' - AI Assistant'}
function showDisabled(code){$('request').style.display='none';$('chat').style.display='none';$('disabled').style.display='flex';const suspended=code==='BOT_SUSPENDED';$('disabledType').textContent=suspended?'SUSPENDED':'DANGEROUS';$('disabledText').textContent=suspended?'Bot Suspended':'Bot Disabled';$('disabledHelp').textContent='This bot is currently unavailable.'}
function showRequest(){$('disabled').style.display='none';$('chat').style.display='none';if(!playground)$('request').style.display='block'}
function openChat(info){currentInfo=info;setName(info.name);$('request').style.display='none';$('disabled').style.display='none';$('chat').style.display='flex';$('sub').textContent=playground?'Owner Playground':'Online';applyBackground(info.background);if(info.limit!=null&&info.remaining!=null)$('limit').textContent=String(info.remaining)+' chats remaining';if(info.welcome_message&&!$('messages').children.length)add('bot',info.welcome_message)}
function applyInfo(info){if(!info)return;if(info.ok){setName(info.name);applyBackground(info.background);currentInfo=info;if(info.status==='DISABLED'||info.status==='SUSPENDED'){showDisabled(info.status);return}if(ticket||playground)openChat({...info,ticket});else showRequest();return}setName(currentInfo?.name||'Bot');if(info.error==='BOT_DISABLED'||info.error==='BOT_SUSPENDED'||info.error==='ALL_BOTS_DISABLED'){showDisabled(info.error);return}}
async function post(url,body,headers={}){const c=new AbortController(),tm=setTimeout(()=>c.abort(),20000);try{const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json',...headers},body:JSON.stringify(body),signal:c.signal});const d=await r.json().catch(()=>({ok:false,error:'NETWORK_ERROR',code:'NETWORK_ERROR'}));return{r,d}}catch(e){return{r:null,d:{ok:false,error:'NETWORK_ERROR',code:'NETWORK_ERROR'}}}finally{clearTimeout(tm)}}
async function connectService(action,payload,timeout=30000){const c=new AbortController(),timer=setTimeout(()=>c.abort(),timeout);try{const r=await fetch(CONNECT_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,bot_id:botId,...payload}),signal:c.signal});const d=await r.json().catch(()=>({ok:false,error:'CONNECTION_SERVICE_ERROR'}));return d?.ok?d:{ok:false,error:d?.error||d?.code||'CONNECTION_SERVICE_ERROR'}}catch(e){return{ok:false,error:e.name==='AbortError'?'NETWORK_ERROR':'CONNECTION_SERVICE_ERROR'}}finally{clearTimeout(timer)}}
async function info(){const r=await connectService('info',{},10000);applyInfo(r);return r}
async function ticketConnect(t){if(!t)return false;const r=await connectService('ticket',{ticket:t},15000);if(r.ok){ticket=t;setCookie(cookieKey,t);openChat(r);return true}clearCookie(cookieKey);ticket='';return false}
async function verifySecret(secret){const r=await connectService('register',{secret_id:secret,origin:registrationOrigin,referrer:document.referrer||registrationOrigin},30000);if(!r.ok||!r.ticket){$('error').textContent=text(r.error);return false}ticket=String(r.ticket);setCookie(cookieKey,ticket);openChat(r);return true}
async function ownerPlayground(token){const r=await post(OWNER_PLAYGROUND_URL,{bot_id:botId},{Authorization:'Bearer '+token});if(r.d.ok&&r.d.ticket){ticket=String(r.d.ticket);openChat(r.d);await info();return true}$('sub').textContent=r.d.error==='FORBIDDEN'?'Owner access denied.':'Owner access could not be verified.';return false}
window.addEventListener('message',e=>{if(e.origin!==location.origin||e.data?.type!=='sdq-owner-playground')return;ownerPlayground(String(e.data.access_token||''))});
async function auto(){if(!botId)return false;if(playground){window.parent!==window&&window.parent.postMessage({type:'sdq-playground-ready'},location.origin);return false}const s=getCookie(cookieKey);if(s&&await ticketConnect(decodeURIComponent(s)))return true;return false}
async function verify(){const secret=$('secret').value.trim().toLowerCase();$('error').textContent='';if(!/^sdq[a-z0-9]{8}$/.test(secret)){$('error').textContent=text('INVALID_SECRET_ID');return}if(!registrationOrigin){$('error').textContent=text('WEBSITE_ORIGIN_REQUIRED');return}$('verify').disabled=true;$('verify').textContent='Connecting...';try{await verifySecret(secret)}finally{$('verify').disabled=false;$('verify').textContent='Verify & Connect'}}
function add(w,t){const d=document.createElement('div');d.className='msg '+w;d.textContent=String(t||'');$('messages').appendChild(d);$('messages').scrollTop=$('messages').scrollHeight;return d}function thinking(){const d=document.createElement('div');d.className='msg bot';d.innerHTML='<span class="thinking">S</span>';$('messages').appendChild(d);$('messages').scrollTop=$('messages').scrollHeight;return d}
async function send(){const message=$('prompt').value.trim();if(!message||!ticket)return;$('prompt').value='';add('user',message);const d=thinking();$('send').disabled=true;const requestKey=crypto.randomUUID?crypto.randomUUID():String(Date.now())+'-'+Math.random().toString(36).slice(2);try{const r=await fetch(RUNTIME_URL,{method:'POST',headers:{'Content-Type':'application/json','apikey':PUBLIC_KEY,'Authorization':'Bearer '+PUBLIC_KEY},body:JSON.stringify({bot_id:botId,ticket,message,request_key:requestKey,visitor_key:getVisitorKey()})});const data=await r.json().catch(()=>({ok:false,code:'NETWORK_ERROR'}));if(!data.ok){d.textContent=text(data.code||data.error);if(data.code==='INVALID_TICKET'){clearCookie(cookieKey);ticket='';showRequest()}if(data.code==='BOT_DISABLED'||data.code==='BOT_SUSPENDED'||data.code==='ALL_BOTS_DISABLED')showDisabled(data.code);if(data.code==='CHAT_LIMIT_REACHED'){$('prompt').disabled=true;$('send').disabled=true;$('limit').textContent='Chat limit reached.'}}else{d.textContent=data.answer||'';if(data.remaining!=null)$('limit').textContent=String(data.remaining)+' chats remaining'}}catch(e){d.textContent='AI service connection failed. Please try again.'}finally{if($('prompt').disabled!==true)$('send').disabled=false}}
$('verify').onclick=verify;$('secret').onkeydown=e=>{if(e.key==='Enter')verify()};$('send').onclick=send;$('prompt').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};
(async()=>{if(!botId){setName('Invalid Bot');return}const meta=await info();if(meta?.error==='BOT_DISABLED'||meta?.error==='BOT_SUSPENDED'||meta?.error==='ALL_BOTS_DISABLED')return;if(playground){$('request').style.display='none';$('disabled').style.display='none';$('sub').textContent='Waiting for owner access...';await auto();return}await auto();if($('chat').style.display==='none'&&$('disabled').style.display==='none')$('sub').textContent=registrationOrigin?'Enter Secret ID once to connect this website.':'Website verification required'})();
setInterval(async()=>{if(!botId||document.hidden)return;const r=await connectService('info',{},10000);if(r.ok||r.error==='BOT_DISABLED'||r.error==='BOT_SUSPENDED'||r.error==='ALL_BOTS_DISABLED')applyInfo(r)},5000);
</script>
</body>
</html>

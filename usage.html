<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sadeeq AI — Usage Bot</title><link rel="icon" href="./chagi-logo.svg"><link rel="stylesheet" href="./dashboard.css"><style>.usage-workspace{padding:28px 34px}.usage-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.usage-card{border:1px solid rgba(255,255,255,.1);border-radius:20px;background:linear-gradient(145deg,rgba(23,32,63,.82),rgba(8,12,27,.9));padding:20px;box-shadow:0 18px 55px rgba(0,0,0,.2);animation:rise .35s ease both}.usage-name{font-size:15px;font-weight:800;margin-bottom:5px}.usage-id{font-size:9px;color:#7f8ba7;letter-spacing:.08em}.usage-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}.usage-stat{padding:11px;border-radius:13px;background:rgba(2,5,14,.42);border:1px solid rgba(255,255,255,.07)}.usage-stat small{display:block;color:#7f8ba7;font-size:8px;margin-bottom:5px}.usage-stat strong{font-size:16px}.usage-empty{padding:45px;text-align:center;color:#7f8ba7}.usage-head{margin-bottom:20px}.usage-head h2{margin:8px 0 5px;font-size:22px}.usage-head p{margin:0;color:#7f8ba7;font-size:11px}@media(max-width:1100px){.usage-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:820px){.usage-workspace{padding:18px 12px}.usage-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){.usage-grid{grid-template-columns:1fr}}</style></head><body data-page="Usage Bot"><div class="app"><aside class="sidebar" id="sidebar"><div class="brand"><img src="./chagi-logo.svg" alt="Sadeeq AI"><div><strong>SADEEQ AI</strong><small>OWNER CONSOLE</small></div></div><nav class="nav"><a class="nav-item" href="./dashboard.html" data-page="Home"><span>⌂</span>Home</a><a class="nav-item" href="./bots.html" data-page="Bots"><span>◈</span>Bots</a><a class="nav-item" href="./all-bots.html" data-page="All Bots"><span>▦</span>All Bots</a><a class="nav-item" href="./instructions.html" data-page="Instructions"><span>≡</span>Instructions</a><a class="nav-item" href="./webs-joined.html" data-page="Webs Joined"><span>◎</span>Webs Joined</a><a class="nav-item active" href="./usage.html" data-page="Usage Bot"><span>▥</span>Usage Bot</a><a class="nav-item" href="./audit.html" data-page="Audit Logs"><span>◷</span>Audit Logs</a><a class="nav-item" href="./sadeeq-ai.html" data-page="Sadeeq AI"><span>✦</span>Sadeeq AI</a><a class="nav-item" href="./api-keys.html" data-page="API Keys"><span>⌁</span>API Keys</a><a class="nav-item" href="./security.html" data-page="Account &amp; Security"><span>♙</span>Account &amp; Security</a></nav><div class="sidebar-footer"><span class="status-dot"></span><span>Owner session</span><button id="logout" title="Logout">↪</button></div></aside><div class="backdrop" id="backdrop"></div><main class="main"><header class="topbar"><button class="menu" id="menu">☰</button><div><p class="eyebrow">OWNER MODULE</p><h1>Usage Bot</h1></div><div class="secure"><span class="status-dot"></span>SECURE</div></header><section class="usage-workspace"><div class="usage-head"><span class="badge">BOT USAGE</span><h2>Usage by bot</h2><p>Accepted requests and successfully recorded responses are counted separately.</p></div><div id="usage-grid" class="usage-grid"><div class="usage-empty">Loading usage…</div></div></section></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./dashboard.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{const grid=document.getElementById('usage-grid');try{if(typeof guardOwner==='function'&&!await guardOwner())return;const[botsRes,usageRes]=await Promise.all([withTimeout(client.from('sadeeq_bots').select('id,public_bot_id,name,status,deleted_at').neq('status','DELETED').order('created_at',{ascending:true})),withTimeout(client.from('sadeeq_bot_usage').select('bot_id,requested_at,response_recorded_at,response_status').order('requested_at',{ascending:false}).limit(10000))]);if(botsRes.error)throw botsRes.error;if(usageRes.error)throw usageRes.error;const bots=botsRes.data||[],rows=usageRes.data||[];const today=new Date();today.setHours(0,0,0,0);const byBot=new Map();bots.forEach(b=>byBot.set(b.id,{name:b.name||'Unnamed Bot',botId:b.public_bot_id||b.id,todayReq:0,allReq:0,todayResp:0,allResp:0}));rows.forEach(r=>{const b=byBot.get(r.bot_id);if(!b)return;const status=String(r.response_status||'').trim().toUpperCase();const requestAccepted=status==='ACCEPTED'||status==='SUCCESS';const responseSuccessful=status==='SUCCESS'&&!!r.response_recorded_at;if(requestAccepted){b.allReq++;const requestDate=new Date(r.requested_at);if(requestDate>=today)b.todayReq++}if(responseSuccessful){b.allResp++;const responseDate=new Date(r.response_recorded_at);if(responseDate>=today)b.todayResp++}});if(!byBot.size){grid.innerHTML='<div class="usage-empty">No active bots found.</div>';return}grid.innerHTML=[...byBot.values()].map(b=>'<article class="usage-card"><div class="usage-name">'+escapeHtml(b.name)+'</div><div class="usage-id">'+escapeHtml(b.botId)+'</div><div class="usage-stats"><div class="usage-stat"><small>TODAY REQUEST</small><strong>'+b.todayReq+'</strong></div><div class="usage-stat"><small>ALL REQUEST</small><strong>'+b.allReq+'</strong></div><div class="usage-stat"><small>TODAY RESPONSE</small><strong>'+b.todayResp+'</strong></div><div class="usage-stat"><small>ALL RESPONSE</small><strong>'+b.allResp+'</strong></div></div></article>').join('')}catch(e){console.error(e);grid.innerHTML='<div class="usage-empty">Usage data unavailable. Please refresh.</div>'}});function escapeHtml(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]))}</script></body></html>

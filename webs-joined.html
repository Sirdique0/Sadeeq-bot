<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sadeeq AI — Webs Joined</title><link rel="icon" href="./chagi-logo.svg"><link rel="stylesheet" href="./dashboard.css"><style>.webs-workspace{padding:20px}.webs-panel{background:rgba(13,18,34,.86);border:1px solid rgba(255,255,255,.08);border-radius:22px;padding:20px;box-shadow:0 18px 50px rgba(0,0,0,.18)}.webs-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px}.webs-head h2{margin:8px 0 4px}.webs-head p{margin:0;color:#8994ae;font-size:13px}.webs-list{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.web-card{min-width:0;border:1px solid rgba(255,255,255,.08);border-radius:15px;padding:13px;background:rgba(255,255,255,.025)}.web-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.web-name{font-weight:800;color:#eef3ff;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.web-origin{font-size:10px;color:#8994ae;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.web-status{flex:none;font-size:9px;font-weight:800;padding:4px 7px;border-radius:999px;background:rgba(104,224,161,.12);color:#68e0a1}.web-status.pending{background:rgba(255,190,71,.12);color:#ffc15f}.web-status.suspended{background:rgba(255,178,71,.12);color:#ffb247}.web-status.removed{background:rgba(255,92,92,.12);color:#ff7777}.web-meta{margin-top:11px;display:grid;gap:7px}.web-meta div{padding:7px 8px;border-radius:9px;background:rgba(255,255,255,.035);overflow:hidden}.web-meta small{display:block;color:#707b94;font-size:8px;margin-bottom:3px}.web-meta span{color:#dce4f5;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}.web-actions{display:flex;gap:6px;margin-top:10px}.web-action{flex:1;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:#dce4f5;border-radius:8px;padding:7px 5px;font-size:10px;font-weight:800;cursor:pointer}.web-action:hover{background:rgba(255,255,255,.08)}.web-action.accept{color:#68e0a1}.web-action.reject,.web-action.remove{color:#ff8585}.web-action.suspend{color:#ffbf69}.web-action.enable{color:#68e0a1}.web-action:disabled{opacity:.45;cursor:not-allowed}.empty-web{padding:35px;text-align:center;border:1px dashed rgba(255,255,255,.1);border-radius:16px;color:#8994ae}.empty-web strong{display:block;color:#eef3ff;margin-bottom:6px}.web-error{color:#ff9b9b}.web-refresh{border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:#dce4f5;border-radius:9px;padding:7px 10px;font-size:10px;font-weight:800;cursor:pointer}@media(max-width:1100px){.webs-list{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:780px){.webs-workspace{padding:12px}.webs-panel{padding:14px}.webs-list{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:480px){.webs-list{grid-template-columns:1fr}}</style></head><body data-page="Webs Joined"><div class="app"><aside class="sidebar" id="sidebar"><div class="brand"><img src="./chagi-logo.svg"><div><strong>SADEEQ AI</strong><small>OWNER CONSOLE</small></div></div><nav class="nav"><a class="nav-item" href="./dashboard.html" data-page="Home"><span>⌂</span>Home</a><a class="nav-item" href="./bots.html" data-page="Bots"><span>◈</span>Bots</a><a class="nav-item" href="./all-bots.html" data-page="All Bots"><span>▦</span>All Bots</a><a class="nav-item" href="./instructions.html" data-page="Instructions"><span>≡</span>Instructions</a><a class="nav-item active" href="./webs-joined.html" data-page="Webs Joined"><span>◎</span>Webs Joined</a><a class="nav-item" href="./usage.html" data-page="API Bot Usage"><span>▥</span>API Bot Usage</a><a class="nav-item" href="./audit.html" data-page="Audit Logs"><span>◷</span>Audit Logs</a><a class="nav-item" href="./sadeeq-ai.html" data-page="Sadeeq AI"><span>✦</span>Sadeeq AI</a><a class="nav-item" href="./api-keys.html" data-page="API Keys"><span>⌁</span>API Keys</a><a class="nav-item" href="./security.html" data-page="Account &amp; Security"><span>♙</span>Account &amp; Security</a></nav><div class="sidebar-footer"><span class="status-dot"></span><span>Owner session</span><button id="logout">↪</button></div></aside><div class="backdrop" id="backdrop"></div><main class="main"><header class="topbar"><button class="menu" id="menu">☰</button><div><p class="eyebrow">OWNER MODULE</p><h1>Webs Joined</h1></div><div class="secure"><span class="status-dot"></span>SECURE</div></header><section class="webs-workspace"><div class="webs-panel"><div class="webs-head"><div><span class="badge">WEBSITE CONNECTIONS</span><h2>Connected websites</h2><p>Registration, approval and access control.</p></div><button id="refreshWebs" class="web-refresh" type="button">Refresh</button></div><div id="webList" class="webs-list"><div class="empty-web">Loading connected websites…</div></div></div></section></main></div><script src="./dashboard.js"></script><script>
(()=>{const SUPA='https://hipzrtvrgjdeldfyudbc.supabase.co',KEY='sb_publishable_NKHdv4Mza99fjiMBPk8C9A_bxcYmsmD',el=document.getElementById('webList'),timeoutMs=5000;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function token(){try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i)||'';if(!k.includes('auth-token'))continue;const raw=localStorage.getItem(k);if(!raw)continue;const j=JSON.parse(raw);if(j?.access_token)return j.access_token}}catch{}return ''}async function req(path,opts={}){const t=token();if(!t)throw new Error('AUTH_REQUIRED');const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),timeoutMs);try{const r=await fetch(SUPA+path,{...opts,signal:ctl.signal,headers:{apikey:KEY,Authorization:'Bearer '+t,'Content-Type':'application/json',...(opts.headers||{})}});const text=await r.text();let data=null;try{data=JSON.parse(text)}catch{}if(!r.ok)throw new Error(data?.message||data?.hint||'REQUEST_FAILED');return data}finally{clearTimeout(timer)}}async function owner(){const u=await req('/auth/v1/user');const rows=await req('/rest/v1/sadeeq_owner_accounts?select=user_id&user_id=eq.'+encodeURIComponent(u.id)+'&limit=1');if(!Array.isArray(rows)||!rows.length)throw new Error('OWNER_REQUIRED');return u.id}async function load(){el.innerHTML='<div class="empty-web">Loading connected websites…</div>';try{await owner();const rows=await req('/rest/v1/sadeeq_bot_websites?select=id,bot_id,website_id,created_at,last_seen_at,status,approved_at&order=created_at.desc');if(!rows?.length){el.innerHTML='<div class="empty-web"><strong>No websites joined yet</strong><span>New registrations will appear here for review.</span></div>';return}const [webs,bots]=await Promise.all([req('/rest/v1/sadeeq_websites?select=id,origin,host,name,status'),req('/rest/v1/sadeeq_bots?select=id,public_bot_id,name')]);const wm=new Map(webs.map(x=>[x.id,x])),bm=new Map(bots.map(x=>[x.id,x]));el.innerHTML=rows.map(x=>{const w=wm.get(x.website_id)||{},b=bm.get(x.bot_id)||{},s=String(x.status||'PENDING').toUpperCase(),ws=String(w.status||'ACTIVE').toUpperCase(),pending=s==='PENDING',suspended=s==='SUSPENDED'||ws==='SUSPENDED',removed=s==='REMOVED'||ws==='REMOVED';const action=removed?'':pending?'<button class="web-action accept" data-action="accept">Accept</button><button class="web-action reject" data-action="reject">Reject</button>':'<button class="web-action suspend '+(suspended?'enable':'')+'" data-action="suspend">'+(suspended?'Enable':'Suspend')+'</button><button class="web-action remove" data-action="remove">Remove</button>';return '<article class="web-card" data-id="'+esc(x.id)+'" data-website-id="'+esc(x.website_id)+'"><div class="web-top"><div style="min-width:0"><div class="web-name">'+esc(w.name||w.host||'Website')+'</div><div class="web-origin">'+esc(w.origin||w.host||'')+'</div></div><span class="web-status '+(pending?'pending ':suspended?'suspended ':removed?'removed ':'')+'">'+esc(s)+'</span></div><div class="web-meta"><div><small>BOT</small><span>'+esc(b.name||'—')+'</span></div><div><small>BOT ID</small><span>'+esc(b.public_bot_id||'—')+'</span></div><div><small>LAST SEEN</small><span>'+esc(x.last_seen_at?new Date(x.last_seen_at).toLocaleString():'Never')+'</span></div></div><div class="web-actions">'+action+'</div></article>'}).join('');bind()}catch(e){console.error(e);el.innerHTML='<div class="empty-web web-error"><strong>Unable to load websites</strong><span>We could not reach the dashboard data. Please refresh.</span></div>'}}async function act(card,action){const wid=card.dataset.websiteId,id=card.dataset.id;if(!wid||!id)return;if(!confirm('Confirm '+action+' for this website?'))return;card.querySelectorAll('button').forEach(b=>b.disabled=true);try{let fn,payload;if(action==='accept'){fn='owner_accept_website';payload={p_website_id:wid}}else if(action==='suspend'){const isEnable=card.querySelector('[data-action="suspend"]')?.textContent.trim()==='Enable';if(isEnable){fn='owner_set_website_status';payload={p_bot_website_id:id,p_status:'ACTIVE'}}else{fn='owner_suspend_website';payload={p_website_id:wid}}}else if(action==='remove'){fn='owner_remove_website';payload={p_website_id:wid}}await req('/rest/v1/rpc/'+fn,{method:'POST',body:JSON.stringify(payload)});await load()}catch(e){alert('Action failed. Please try again.');card.querySelectorAll('button').forEach(b=>b.disabled=false)}}function bind(){el.querySelectorAll('.web-card').forEach(card=>card.querySelectorAll('button').forEach(btn=>btn.addEventListener('click',()=>act(card,btn.dataset.action))))}document.getElementById('refreshWebs')?.addEventListener('click',load);load()})();
</script></body></html>

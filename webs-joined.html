n j.access_token}}catch{}return ''}async function req(path,opts={}){const t=tok();if(!t)throw Error('AUTH_REQUIRED');const c=new AbortController(),tm=setTimeout(()=>c.abort(),4500);try{const r=await fetch(U+path,{...opts,signal:c.signal,headers:{apikey:K,Authorization:'Bearer '+t,'Content-Type':'application/json',...(opts.headers||{})}}),tx=await r.text();let d=null;try{d=tx?JSON.parse(tx):null}catch{}if(!r.ok)throw Error(d?.message||d?.hint||'REQUEST_FAILED');return d}finally{clearTimeout(tm)}}function closeMenu(){side?.classList.remove('open');back?.classList.remove('show');document.body.classList.remove('menu-open')}function openMenu(){side?.classList.add('open');back?.classList.add('show');document.body.classList.add('menu-open')}menu?.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();side.classList.contains('open')?closeMenu():openMenu()});menu?.addEventListener('touchend',e=>{e.preventDefault();e.stopPropagation();side.classList.contains('open')?closeMenu():openMenu()},{passive:false});back?.addEventListener('click',closeMenu);back?.addEventListener('touchend',e=>{e.preventDefault();closeMenu()},{passive:false});document.querySelectorAll('.nav-item').forEach(a=>{a.addEventListener('click',()=>closeMenu());a.addEventListener('touchend',()=>closeMenu(),{passive:true})});document.getElementById('logout')?.addEventListener('click',async()=>{const t=tok();if(t)try{await fetch(U+'/auth/v1/logout',{method:'POST',headers:{apikey:K,Authorization:'Bearer '+t}})}catch{}location.href='./auth.html#login'});function render(rows){if(!rows?.length){el.innerHTML='<div class="empty-web"><strong>No websites joined yet</strong><span>New registrations will appear here for review.</span></div>';return}el.innerHTML=rows.map(x=>{const s=String(x.connection_status||'PENDING').toUpperCase(),ws=String(x.website_status||'ACTIVE').toUpperCase(),pending=s==='PENDING',removed=s==='REMOVED'||ws==='REMOVED',suspended=s==='SUSPENDED'||ws==='SUSPENDED';let buttons='';if(pending)buttons='<button class="web-action accept" data-action="accept">Accept</button><button class="web-action reject" data-action="reject">Reject</button>';else if(!removed)buttons='<button class="web-action '+(suspended?'enable':'suspend')+'" data-action="'+(suspended?'enable':'suspend')+'">'+(suspended?'Enable':'Suspend')+'</button><button class="web-action remove" data-action="remove">Remove</button>';return '<article class="web-card" data-id="'+esc(x.connection_id)+'" data-website="'+esc(x.website_id)+'"><div class="web-top"><div style="min-width:0"><div class="web-name">'+esc(x.website_name||x.host||'Website')+'</div><div class="web-origin">'+esc(x.origin||x.host||'')+'</div></div><span class="web-status '+(pending?'pending ':suspended?'suspended ':removed?'removed ':'')+'">'+esc(s)+'</span></div><div class="web-meta"><div><small>BOT</small><span>'+esc(x.bot_name||'Bot')+'</span></div><div><small>BOT ID</small><span>'+esc(x.public_bot_id||'—')+'</span></div><div><small>TICKET ID</small><span title="'+esc(x.ticket_id||'')+'">'+esc(x.ticket_id||'Not issued')+'</span></div><div><small>LAST SEEN</small><span>'+esc(x.last_seen_at?new Date(x.last_seen_at).toLocaleString():'Never')+'</span></div></div><div class="web-actions">'+buttons+'</div></article>'}).join('');el.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();act(b.closest('.web-card'),b.dataset.action)}))}async function load(){el.innerHTML='<div class="empty-web">Loading connected websites…</div>';try{const rows=await req('/rest/v1/rpc/owner_list_websites',{method:'POST',body:'{}'});render(rows)}catch(e){console.error(e);el.innerHTML='<div class="empty-web web-error"><strong>Unable to load websites</strong><span>We could not reach the dashboard data. Please refresh.</span></div>'}}async function act(card,action){if(!card)return;const wid=card.dataset.website,id=card.dataset.id;if(!wid||!id)return;if(!confirm('Confirm '+action+' for this website?'))

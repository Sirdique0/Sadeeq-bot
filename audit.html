<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sadeeq AI — Audit Logs</title><link rel="icon" href="./chagi-logo.svg"><link rel="stylesheet" href="./dashboard.css"><style>.audit-workspace{padding:28px 34px}.audit-panel{background:rgba(8,12,27,.72);border:1px solid rgba(255,255,255,.09);border-radius:20px;overflow:hidden}.audit-toolbar{padding:16px 18px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;gap:10px;align-items:center;justify-content:space-between}.audit-toolbar input,.audit-toolbar select{background:rgba(255,255,255,.05);color:inherit;border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:9px 11px;font-size:11px}.audit-list{overflow:auto}.audit-row{display:grid;grid-template-columns:150px 110px 100px 130px 1fr;gap:12px;padding:14px 18px;border-bottom:1px solid rgba(255,255,255,.06);font-size:10px;align-items:center}.audit-row.head{font-size:8px;color:#7f8ba7;text-transform:uppercase;letter-spacing:.08em}.audit-time{color:#9aa6c2}.audit-action{font-weight:800}.audit-status{font-weight:800}.audit-status.SUCCESS{color:#69d99b}.audit-status.FAIL,.audit-status.DENIED{color:#ff7c83}.audit-status.INFO{color:#8da8ff}.audit-detail{color:#7f8ba7;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.audit-empty{text-align:center;padding:45px;color:#7f8ba7}.audit-live{font-size:8px;color:#69d99b;margin-left:8px}.audit-live.off{color:#ff7c83}@media(max-width:850px){.audit-workspace{padding:16px 12px}.audit-row{grid-template-columns:125px 1fr 85px;gap:8px}.audit-row>:nth-child(4),.audit-row>:nth-child(5){display:none}}</style></head><body data-page="Audit Logs"><div class="app"><aside class="sidebar" id="sidebar"><div class="brand"><img src="./chagi-logo.svg" alt="Sadeeq AI"><div><strong>SADEEQ AI</strong><small>OWNER CONSOLE</small></div></div><nav class="nav"><a class="nav-item" href="./dashboard.html" data-page="Home"><span>⌂</span>Home</a><a class="nav-item" href="./bots.html" data-page="Bots"><span>◈</span>Bots</a><a class="nav-item" href="./all-bots.html" data-page="All Bots"><span>▦</span>All Bots</a><a class="nav-item" href="./instructions.html" data-page="Instructions"><span>≡</span>Instructions</a><a class="nav-item" href="./webs-joined.html" data-page="Webs Joined"><span>◎</span>Webs Joined</a><a class="nav-item" href="./usage.html" data-page="Usage Bot"><span>▥</span>Usage Bot</a><a class="nav-item active" href="./audit.html" data-page="Audit Logs"><span>◷</span>Audit Logs</a><a class="nav-item" href="./sadeeq-ai.html" data-page="Sadeeq AI"><span>✦</span>Sadeeq AI</a><a class="nav-item" href="./api-keys.html" data-page="API Keys"><span>⌁</span>API Keys</a><a class="nav-item" href="./security.html" data-page="Account & Security"><span>♙</span>Account &amp; Security</a></nav><div class="sidebar-footer"><span class="status-dot"></span><span>Owner session</span><button id="logout">↪</button></div></aside><div class="backdrop" id="backdrop"></div><main class="main"><header class="topbar"><button class="menu" id="menu">☰</button><div><p class="eyebrow">OWNER MODULE</p><h1>Audit Logs</h1></div><div class="secure"><span class="status-dot"></span>SECURE</div></header><section class="audit-workspace"><div class="audit-panel"><div class="audit-toolbar"><span class="badge">SECURITY AUDIT <span id="live" class="audit-live">● LIVE</span></span><div><input id="audit-search" placeholder="Search action…"><select id="audit-status"><option value="">All status</option><option>SUCCESS</option><option>FAIL</option><option>DENIED</option><option>INFO</option></select></div></div><div class="audit-list"><div class="audit-row head"><span>Date / time</span><span>Action</span><span>Status</span><span>Resource</span><span>Details</span></div><div id="audit-list"></div></div></div></section></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./dashboard.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{if(typeof guardOwner==='function'&&!await guardOwner())return;const list=document.getElementById('audit-list'),search=document.getElementById('audit-search'),status=document.getElementById('audit-status'),live=document.getElementById('live');let rows=[];async function load(){const{data,error}=await withTimeout(client.from('sadeeq_audit_logs').select('id,created_at,action,status,resource_type,resource_id,bot_id,website_id,details').order('created_at',{ascending:false}).limit(500));if(error){list.innerHTML='<div class="audit-empty">Unable to load audit logs. Please refresh.</div>';return}rows=data||[];render()}function render(){const q=search.value.trim().toLowerCase(),s=status.value;const filtered=rows.filter(r=>(!q||String(r.action).toLowerCase().includes(q)||JSON.stringify(r.details||{}).toLowerCase().includes(q))&&(!s||r.status===s));if(!filtered.length){list.innerHTML='<div class="audit-empty">No audit records found.</div>';return}list.innerHTML=filtered.map(r=>'<div class="audit-row"><span class="audit-time">'+new Date(r.created_at).toLocaleString()+'</span><span class="audit-action">'+esc(r.action)+'</span><span class="audit-status '+esc(r.status)+'">'+esc(r.status)+'</span><span>'+esc(r.resource_type||'—')+'</span><span class="audit-detail">'+esc(JSON.stringify(r.details||{}))+'</span></div>').join('')}search.addEventListener('input',render);status.addEventListener('change',render);await load();const channel=client.channel('audit-logs-live').on('postgres_changes',{event:'INSERT',schema:'public',table:'sadeeq_audit_logs'},payload=>{if(payload.new)rows=[payload.new,...rows.filter(x=>x.id!==payload.new.id)].slice(0,500);render()}).subscribe(state=>{if(state==='SUBSCRIBED'){live.textContent='● LIVE';live.classList.remove('off')}else if(state==='CHANNEL_ERROR'||state==='TIMED_OUT'||state==='CLOSED'){live.textContent='● OFFLINE';live.classList.add('off')}});window.addEventListener('beforeunload',()=>{try{client.removeChannel(channel)}catch{}})});</script></body></html>

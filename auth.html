<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050816">
  <title>Sadeeq AI — Owner Access</title>
  <link rel="icon" href="./chagi-logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./auth.css?v=20260902-4">
</head>
<body>
  <main class="auth-shell">
    <section class="auth-card" aria-label="Sadeeq AI owner authentication">
      <a class="back" href="./index.html">← Back</a>
      <img class="auth-logo" src="./chagi-logo.svg" alt="Sadeeq AI">
      <p class="eyebrow">SADEEQ AI • OWNER ACCESS</p>
      <h1 id="title">Login</h1>
      <p id="subtitle">This area is restricted to the system owner.</p>
      <div id="status" class="status" role="status" aria-live="polite"></div>

      <form id="login-form" class="form">
        <label>Email<input id="email" type="email" autocomplete="username" required></label>
        <label>Password<input id="password" type="password" autocomplete="current-password" required></label>
        <button class="primary" type="submit">Login</button>
        <button class="secondary" id="forgot-password-btn" type="button">Forgot Password?</button>
      </form>

      <form id="reset-request-form" class="form hidden">
        <label>Owner email<input id="reset-email" type="email" autocomplete="email" required></label>
        <button class="primary" type="submit">Send Verification Code</button>
        <button class="secondary" id="back-to-login-btn" type="button">Back to Login</button>
      </form>

      <form id="reset-verify-form" class="form hidden">
        <label>Verification code<input id="reset-code" type="text" inputmode="numeric" autocomplete="one-time-code" minlength="6" maxlength="6" pattern="[0-9]{6}" required></label>
        <p id="reset-countdown" class="reset-countdown" aria-live="polite"></p>
        <button class="primary" type="submit">Verify</button>
        <button class="secondary" id="resend-code-btn" type="button" disabled>Resend Code</button>
      </form>

      <form id="new-password-form" class="form hidden">
        <label>New password<input id="new-password" type="password" minlength="8" autocomplete="new-password" required></label>
        <label>Confirm new password<input id="new-password-confirm" type="password" minlength="8" autocomplete="new-password" required></label>
        <button class="primary" type="submit">Save New Password</button>
      </form>

      <form id="signup-form" class="form hidden">
        <label>Email<input id="signup-email" type="email" autocomplete="email" required></label>
        <label>Password<input id="signup-password" type="password" minlength="8" autocomplete="new-password" required></label>
        <label>Confirm password<input id="signup-confirm" type="password" minlength="8" autocomplete="new-password" required></label>
        <button class="primary" type="submit">Create Owner Account</button>
      </form>

      <div id="pin-setup-panel" class="pin-panel hidden">
        <strong id="pin-setup-title">Set Owner PIN</strong>
        <p>Create a 6–12 digit PIN. It will be required after password login.</p>
        <label>PIN<input id="setup-pin" type="password" inputmode="numeric" pattern="[0-9]{6,12}" maxlength="12" autocomplete="new-password"></label>
        <label>Confirm PIN<input id="setup-pin-confirm" type="password" inputmode="numeric" pattern="[0-9]{6,12}" maxlength="12" autocomplete="new-password"></label>
        <button class="primary" id="save-pin-btn" type="button">Save PIN &amp; Open Console</button>
      </div>

      <div id="pin-panel" class="pin-panel hidden">
        <strong>Owner PIN</strong>
        <p>Enter your owner PIN to continue to the console.</p>
        <label>PIN<input id="pin" type="password" inputmode="numeric" pattern="[0-9]{6,12}" maxlength="12" autocomplete="current-password"></label>
        <button class="primary" id="pin-btn" type="button">Open Console</button>
        <button class="secondary" id="forgot-pin-btn" type="button">Forgot PIN? Verify password</button>
      </div>

      <div class="switch-row">
        <button id="show-login" type="button">Login</button>
        <button id="show-signup" type="button">Initial Owner Signup</button>
      </div>
      <small>Passwords and PINs are never stored in browser storage.</small>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./auth.js?v=20260902-4"></script>
</body>
</html>
